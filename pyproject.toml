[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractgym"
version = "0.1.0"
description = "Minimal CFG trace environment for training and evaluating meta-execution traces."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AbstractGym contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
